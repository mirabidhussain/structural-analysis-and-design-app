plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mirabid.ismodeller'
    compileSdk 34

    // one fixed debug key in the repository, so every CI build installs over the previous one (a random key per build
    // makes Android refuse the update with "App not installed — package conflicts with an existing package")
    signingConfigs {
        debug {
            storeFile file("isd-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.mirabid.ismodeller"
        minSdk 24
        targetSdk 34
        // set by CI: VERSION_CODE = run number + 100, VERSION_NAME = engine version + build number
        versionCode((System.getenv("VERSION_CODE") ?: "2").toInteger())
        versionName(System.getenv("VERSION_NAME") ?: "dev")
    }

    sourceSets {
        // the web app (www/) is packaged directly as the APK's assets
        main.assets.srcDirs += ['../../modeller/www']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
