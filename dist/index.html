<title>IS StructDesign</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#16202c;--mut:#5d6b7b;--line:#dfe4ea;--pri:#1d3557;--acc:#e07a1f;--ok:#1e8e4a;--no:#c62828;--okbg:#e8f6ee;--nobg:#fdecec;--eq:#f1f4f8}

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:#1d3557;color:#fff;box-shadow:0 2px 6px #0003}

.intro{color:var(--mut);margin:4px 2px 10px}

.card:active{transform:scale(.98)}.card .ic{font-size:22px;color:var(--acc);height:28px}.card b{font-size:15px}.card small{color:var(--mut);font-size:12.5px;flex:1}.card em{font-style:normal;font-size:11px;color:var(--pri);font-weight:600}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .code{grid-column:1/-1;font-size:12px;color:var(--pri);font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px}.fld span{color:var(--mut)}.fld i{font-style:normal;opacity:.8}.fld small{color:var(--mut);font-size:11.5px}
.fld:has(textarea){grid-column:1/-1}

.btns{grid-column:1/-1;display:flex;gap:10px;margin-top:4px}
button{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:2px solid var(--pri);padding-bottom:8px}
.rh h3{margin:0;font-size:17px}.rh small{color:var(--mut)}
.badge{font-size:11.5px;font-weight:700;border-radius:20px;padding:5px 10px;white-space:nowrap}.badge.pass{background:var(--okbg);color:var(--ok)}.badge.fail{background:var(--nobg);color:var(--no)}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin:10px 0}
.sum div{background:var(--eq);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}.sum span{font-size:11.5px;color:var(--mut)}.sum b{font-size:14px}
.rep h4{margin:14px 0 6px;font-size:14px;color:var(--pri)}
.row,.chk{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row b,.chk b{text-align:right;font-weight:600}.row i,.chk i,.eq i{font-style:normal;color:var(--mut);font-size:11.5px}
.eq{background:var(--eq);border-left:3px solid var(--pri);padding:6px 9px;margin:5px 0;font-size:13px;border-radius:0 6px 6px 0;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-word}
.chk.ok span{color:var(--ok)}.chk.no{background:var(--nobg)}.chk.no span{color:var(--no);font-weight:600}
.note{font-size:12.5px;color:var(--mut);margin:6px 0;padding-left:8px;border-left:2px solid var(--acc)}
.err{background:var(--nobg);color:var(--no);padding:10px;border-radius:8px;margin:8px 0;font-weight:600}
.tw{overflow-x:auto;margin:6px 0}.warnt{color:#b26a00;font-weight:600}.projbar{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:14px}.projbar a{font-weight:650;color:var(--pri);text-decoration:none}.stchip{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;background:var(--eq);color:var(--mut)}.stchip.st1{background:#e3eefb;color:#1d5fa8}.stchip.st2{background:#fff3dd;color:#a35d00}.stchip.st3{background:var(--okbg);color:var(--ok)}.stchip.st4{background:#1d3557;color:#fff}.stchip.st5{background:var(--nobg);color:var(--no)}.prow{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px}.prow.cur{background:var(--eq);border-radius:8px;padding:8px}.prow small{color:var(--mut)}.pbtn{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.pbtn button{padding:6px 9px;font-size:12.5px}.pbtn .del{color:var(--no)}.btnl{display:inline-flex;align-items:center;justify-content:center;font-weight:600;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;text-decoration:none}.btnl.pri{background:var(--acc);border-color:var(--acc);color:#fff;flex:1}.vchip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 7px;margin-right:3px;vertical-align:1px;white-space:nowrap}.vchip.v3{background:var(--okbg);color:var(--ok)}.vchip.v2{background:#e3eefb;color:#1d5fa8}.vchip.v1{background:#fff3dd;color:#a35d00}.vchip.v0,.vchip.vf{background:var(--nobg);color:var(--no)}.vbox{border-left:5px solid #b26a00;background:#fff7e8;color:#4a3200;padding:9px 11px;border-radius:0 8px 8px 0;margin:8px 0}.vbox.vok{border-color:var(--ok);background:var(--okbg);color:inherit}.vbox.vno{border-color:var(--no);background:var(--nobg);color:inherit}.vprog{height:8px;background:var(--eq);border-radius:5px;overflow:hidden;margin:4px 0 8px}.vprog i{display:block;height:100%;background:var(--ok)}.vitem{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:7px 0;font-size:13px}.vitem small{color:var(--mut)}.vitem.r-ok{opacity:.75}.vitem.r-query{background:var(--nobg)}.vsign{font-weight:600}.vbtn{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}.vbtn button{padding:5px 8px;font-size:12px}.rep.pro details.sub{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}.rep.pro summary{cursor:pointer}input.rate{width:110px;padding:5px 6px;font-size:14px}.afind{border-left:4px solid var(--line);padding:6px 9px;margin:6px 0;background:var(--eq);border-radius:0 8px 8px 0;font-size:13px}.afind small{color:var(--mut)}.afind.s3{border-color:var(--no)}.afind.s2{border-color:var(--acc)}.afind.s1{border-color:#1d5fa8}.asev{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.aans{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px;white-space:normal}.aans.ai{border-color:var(--pri)}.aans pre{white-space:pre-wrap;font-size:11.5px;margin:4px 0 0}.card.proj{border-color:var(--pri)}table.tl td{text-align:left;white-space:normal}
.mbr{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.35}.dwg{display:block;background:#fff}.dwgt{font-size:12px;font-weight:600;margin-top:8px;color:var(--ink,#1d3557)}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid var(--line);padding:5px 6px;text-align:right;white-space:nowrap}th{background:var(--eq);font-weight:600}td:first-child,th:first-child{text-align:left}
.svg{margin:10px 0;background:#fff;border-radius:8px;padding:4px}
.disc{font-size:11.5px;color:var(--mut);margin-top:12px;font-style:italic}
ul{padding-left:20px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}li{margin:3px 0}
.card.wide{grid-column:1/-1;min-height:0}
.code-note{font-size:12.5px;color:var(--pri);font-weight:600;margin:2px 2px 10px}
.pnl{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.pnl>h3{margin:0;padding:12px 14px;font-size:15px;cursor:pointer;display:flex;justify-content:space-between}.pnl>h3:after{content:"▸";color:var(--mut)}.pnl.open>h3:after{content:"▾"}
.pnl .pb{display:none;padding:0 10px 10px}.pnl.open .pb{display:block}.pnl .form{border:0;padding:4px}
.form .full,.form .note.full,.form .btns.full{grid-column:1/-1}.form.inner{padding:0;border:0;grid-column:1/-1}
.fld.ck span{display:flex;align-items:center;gap:8px;color:var(--ink)}.fld.ck input{width:20px;height:20px;padding:0}
.lbl{font-size:13px;color:var(--mut);margin:4px 0}
.viewer canvas{width:100%;display:block;border-radius:8px;touch-action:none;border:1px solid var(--line)}
.vbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.vbar select{flex:1;min-width:140px;font-size:14px;padding:7px}.vbar button{padding:7px 10px;font-size:13px}
.leg{font-size:12.5px;margin:6px 2px;color:var(--mut)}.cbar{display:inline-block;width:90px;height:10px;border-radius:3px;background:linear-gradient(90deg,#2166ac,#67a9cf,#d1e5f0,#f4a582,#b2182b);vertical-align:middle}
.selbox{border-top:2px solid var(--pri);margin-top:8px;padding-top:6px}.selbox h4{margin:4px 0}.small{font-size:12.5px;color:var(--mut);margin:3px 0}
.dbox{font-size:13px;border-radius:8px;padding:8px 10px;margin:6px 0}.okb{background:var(--okbg)}.nob{background:var(--nobg)}
.okt{color:var(--ok);font-weight:700}.not{color:var(--no);font-weight:700}a.lk{color:var(--pri);text-decoration:underline;cursor:pointer}
.busy{display:flex;align-items:center;gap:10px;font-weight:600}.busy i{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.calc{border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 10px;background:var(--card)}.calc summary{font-weight:700;cursor:pointer;padding:4px 0}
.ch{font-weight:700;color:var(--pri);margin:10px 0 4px;font-size:13.5px}.cs{border-left:3px solid var(--line);padding:4px 8px;margin:4px 0;font-size:13px}.cs.cok{border-left-color:var(--ok)}.cs.cno{border-left-color:var(--no);background:var(--nobg)}
.cl{font-weight:600}.cl i{font-style:normal;color:var(--mut);font-weight:400;font-size:11.5px}.ce{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--pri);font-size:12.5px;margin:2px 0}.cv{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}.cm{font-size:12px;color:var(--mut)}
table.basis td{white-space:normal;text-align:left;vertical-align:top}table.basis td.eqc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}table.basis td.bg{background:var(--eq);font-weight:700;color:var(--pri)}
@media print{details.calc{break-inside:avoid}details.calc>*{display:block}}
.mbadge{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--acc)}
.asg{display:flex;gap:6px;margin:6px 0}.asg input{flex:1;font-size:14px;padding:7px}.asg button{padding:7px 10px;font-size:13px}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.75}
.dg svg{background:var(--eq);border-radius:6px}
@media print{.pnl,.vbar,#mstat,.viewer .note{display:none!important}.viewer canvas{border:0}}
@media (max-width:420px){.form{grid-template-columns:1fr}}
@media print{header,.form,.noprint,.intro{display:none!important}body,main{background:#fff;color:#000;padding:0}.rep{border:0;margin:0;padding:0}.chk.no{background:#fdd}.eq{background:#f3f3f3}}
</style>

<script>

/* Code tables and section library. Values per IS 456:2000, IS 800:2007, IS 875, IS 1893:2016 and SP 6(1).
   Section properties are standard-table values (rounded) - verify against SP 6(1)/IS 808 for final design. */
var D = {};

/* IS 456 Table 19 - design shear strength of concrete tc (N/mm2) vs pt for M15..M40 */
D.T19_pt = [0.15, 0.25, 0.50, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75, 3.00];

  30: [0.29, 0.37, 0.50, 0.59, 0.66, 0.71, 0.76, 0.80, 0.84, 0.88, 0.91, 0.94, 0.96],
  35: [0.29, 0.37, 0.50, 0.59, 0.67, 0.73, 0.78, 0.82, 0.86, 0.90, 0.93, 0.96, 0.99],
  40: [0.30, 0.38, 0.51, 0.60, 0.68, 0.74, 0.79, 0.84, 0.88, 0.92, 0.95, 0.98, 1.01]
};
/* IS 456 Table 20 - tc,max */
D.T20 = { 15: 2.5, 20: 2.8, 25: 3.1, 30: 3.5, 35: 3.7, 40: 4.0 };
/* cl 40.2.1.1 - k for solid slabs vs overall depth (mm) */
D.slabK = [[300, 1.00], [275, 1.05], [250, 1.10], [225, 1.15], [200, 1.20], [175, 1.25], [0, 1.30]];
/* cl 38.1 - xu,max/d */
D.xumax = { 250: 0.53, 415: 0.48, 500: 0.46, 550: 0.44 };
/* cl 26.2.1.1 - design bond stress (plain bars in tension); x1.6 deformed, +25% compression */
D.tbd = { 15: 1.0, 20: 1.2, 25: 1.4, 30: 1.5, 35: 1.7, 40: 1.9 };
/* IS 456 Fig 23 - design stress-strain for HYSD bars (points: strain, stress/(0.87fy)) */
D.hysd = {
  415: [[0, 0], [0.00144, 0.80], [0.00163, 0.85], [0.00192, 0.90], [0.00241, 0.95], [0.00276, 0.975], [0.00380, 1.0]],

};
/* IS 456 Table 26 - two-way slab moment coefficients (restrained). ratios ly/lx */
D.T26_r = [1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.75, 2.0];
D.T26 = [
  { name: "1. Interior panel", xn: [.032, .037, .043, .047, .051, .053, .060, .065], xp: [.024, .028, .032, .036, .039, .041, .045, .049], yn: .032, yp: .024 },
  { name: "2. One short edge discontinuous", xn: [.037, .043, .048, .051, .055, .057, .064, .068], xp: [.028, .032, .036, .039, .041, .044, .048, .052], yn: .037, yp: .028 },
  { name: "3. One long edge discontinuous", xn: [.037, .044, .052, .057, .063, .067, .077, .085], xp: [.028, .033, .039, .044, .047, .051, .059, .065], yn: .037, yp: .028 },
  { name: "4. Two adjacent edges discontinuous", xn: [.047, .053, .060, .065, .071, .075, .084, .091], xp: [.035, .040, .045, .049, .053, .056, .063, .069], yn: .047, yp: .035 },
  { name: "5. Two short edges discontinuous", xn: [.045, .049, .052, .056, .059, .060, .065, .069], xp: [.035, .037, .040, .043, .044, .045, .049, .052], yn: 0, yp: .035 },
  { name: "6. Two long edges discontinuous", xn: null, xp: [.035, .043, .051, .057, .063, .068, .080, .088], yn: .045, yp: .035 },
  { name: "7. Three edges discont. (one long edge continuous)", xn: [.057, .064, .071, .076, .080, .084, .091, .097], xp: [.043, .048, .053, .057, .060, .064, .069, .073], yn: 0, yp: .043 },
  { name: "8. Three edges discont. (one short edge continuous)", xn: null, xp: [.043, .051, .059, .065, .071, .076, .087, .096], yn: .057, yp: .043 },
  { name: "9. Four edges discontinuous", xn: null, xp: [.056, .064, .072, .079, .085, .089, .100, .107], yn: 0, yp: .056 },
  { name: "10. Simply supported, corners free (Table 27)", ss: true }
];
/* IS 800 Table 7 / buckling curves */
D.alpha = { a: 0.21, b: 0.34, c: 0.49, d: 0.76 };
D.E = 200000; D.G = 76900;
D.gm0 = 1.10; D.gm1 = 1.25; D.gmb = 1.25; D.gmw = 1.25;

D.angleK = { fixed2: [0.20, 0.35, 20], hinged2: [0.70, 0.60, 5], fixed1: [0.75, 0.35, 20], hinged1: [1.25, 0.50, 60] };

  ["ISA 40x40x5", 40, 5, 3.78, 2.97, 1.18, 1.21, 0.77],
  ["ISA 45x45x5", 45, 5, 4.28, 3.36, 1.30, 1.37, 0.87],

  ["ISA 75x75x6", 75, 6, 8.66, 6.80, 2.06, 2.30, 1.48],

  ["ISA 90x90x8", 90, 8, 13.79, 10.83, 2.51, 2.75, 1.76],
  ["ISA 100x100x8", 100, 8, 15.39, 12.08, 2.76, 3.07, 1.96],
  ["ISA 100x100x10", 100, 10, 19.03, 14.94, 2.84, 3.05, 1.95],
  ["ISA 110x110x10", 110, 10, 21.06, 16.53, 3.08, 3.36, 2.15],
  ["ISA 130x130x10", 130, 10, 25.06, 19.67, 3.59, 3.99, 2.55],
  ["ISA 150x150x12", 150, 12, 34.59, 27.15, 4.16, 4.60, 2.94]
].map(function (r) { return { name: r[0], a: r[1], t: r[2], A: r[3], m: r[4], C: r[5], rxx: r[6], rvv: r[7] }; });

/* ISMB: name, D, bf, tf, tw (mm), A cm2, Ixx, Iyy cm4, rx, ry cm, Zex, Zpx cm3, mass kg/m */
D.ISMB = [
  ["ISMB 100", 100, 75, 7.2, 4.0, 14.6, 257.5, 40.8, 4.20, 1.67, 51.5, 58.9, 11.5],
  ["ISMB 125", 125, 75, 7.6, 4.4, 16.6, 449.0, 43.7, 5.20, 1.62, 71.8, 82.3, 13.0],

RCC.beam = function (p) {

  r.eq("Mu,lim = 0.36 fck b xu,max (d - 0.42 xu,max) = " + U.f(Mlim) + " kNm", "Annex G-1.1");
  var Ast, Asc = 0, doubly = Mu > Mlim;
  if (!doubly) {

    r.eq("Singly reinforced: Ast = 0.5 fck/fy [1 - √(1 - 4.6Mu/(fck b d²))] b d = " + U.f(Ast, 0) + " mm²", "Annex G-1.1(b)");

    r.eq("Asc = (Mu - Mu,lim)/((fsc - 0.446fck)(d - d')) = " + U.f(Asc, 0) + " mm²", "Annex G-1.2");

/* ------------------------------------------------------------ COLUMN (strain compatibility) */
/* section capacity: bars as layers [{y (from top), As}], returns {P (kN), M (kNm)} for neutral axis xu (mm) */

RCC.column = function (p) {

  r.h("2. Design moments");

/* ------------------------------------------------------------ ISOLATED FOOTING */

  function read(m, form) {
    var p = {}, raw = {}, defs = [];
    Object.keys(m.f).forEach(function (k) {
      var f = m.f[k], el = form.elements[k], v = String(el.value).trim(); raw[k] = v;
      if (f.type !== "select" && v === "") { v = String(f.def); defs.push(f.label.replace(/<[^>]+>/g, "") + (f.type === "number" ? " = " + f.def + (f.unit ? " " + f.unit : "") : "")); }
      if (f.type === "number") { var n = parseFloat(v); if (!isFinite(n)) { n = parseFloat(f.def); defs.push(f.label); } p[k] = n; }
      else if (f.type === "select") p[k] = f.num ? parseFloat(v) : v;
      else p[k] = v;
    });
    if (p.vb !== undefined) p.vb = p.vb === "Custom" ? p.vbc : D.vb[p.vb];
    if (m.id === "seismic") p.floors = String(p.floors).split(/\n/).map(function (l) { var a = l.split(","); return a.length >= 3 ? { name: a[0].trim(), w: parseFloat(a[1]), h: parseFloat(a[2]) } : null; }).filter(Boolean);
    if (m.id === "sbeam") { p.lat = !!p.lat; p.destab = !!p.destab; }

    if (m.id === "comp" && !p.Ly) p.Ly = p.L;
    if (m.id === "slab2") p.case_ = parseInt(p.case_, 10);
    raw.__ran = true; store(m.id, raw);
    p.__defaults = defs;

  }
