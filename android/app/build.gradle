plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mirabid.isdesign'
    compileSdk 34

    defaultConfig {
        applicationId "com.mirabid.isdesign"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    sourceSets {
        // the web app (www/) is packaged directly as the APK's assets
        main.assets.srcDirs += ['../../www']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
