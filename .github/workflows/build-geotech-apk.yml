name: Build IS GeoTech APK

on:
  push:
    branches: [ main ]
    paths: [ 'geotech/**', 'geotech-android/**', '.github/workflows/build-geotech-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Engine test
        run: node geotech/test/core_test.js
      - name: Version
        run: |
          VER=$(sed -n 's/.*C\.VERSION = "\([0-9.]*\)".*/\1/p' geotech/www/js/gcore.js | head -1)
          echo "VER=$VER" >> $GITHUB_ENV
          echo "VERSION_NAME=$VER.${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> $GITHUB_ENV
          echo "BUILT=$(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')" >> $GITHUB_ENV
      - name: Build debug APK
        run: gradle -p geotech-android assembleDebug --no-daemon
      - name: Collect files
        run: |
          python3 geotech/build.py
          cp geotech-android/app/build/outputs/apk/debug/app-debug.apk "IS-GeoTech-v$VER.apk"
          cp dist-geotech/index.html "IS-GeoTech-v$VER.html"
      - uses: actions/upload-artifact@v4
        with:
          name: IS-GeoTech-apk
          path: IS-GeoTech-v*.apk
      # One permanent release per GeoTech version ("geotech-v1.0", …). Never marked latest, so IS StructDesign's
      # "latest-apk" link stays where it is.
      - name: Keep a release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'IS GeoTech %s — soil and shallow foundation app, companion to IS StructDesign (built %s, commit %s).\n\nBorehole logs and SPT corrections, soil classification (IS 1498), bearing capacity (IS 6403), settlement with time (IS 8009 Part 1), IS 1904:2021 limits, pressure bulb and weak-layer checks, plate load test (IS 1888), printable report.\n\nAPK: install on Android (a separate app; IS StructDesign and IS StructModeller are not affected). HTML: open in any browser, works offline.\n' "$VERSION_NAME" "$BUILT" "${GITHUB_SHA::7}" > notes.md
          TAG="geotech-v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "IS-GeoTech-v$VER.apk" "IS-GeoTech-v$VER.html" --clobber
            gh release edit "$TAG" --notes-file notes.md --title "IS GeoTech v$VER"
          else
            gh release create "$TAG" "IS-GeoTech-v$VER.apk" "IS-GeoTech-v$VER.html" --target "$GITHUB_SHA" --title "IS GeoTech v$VER" --notes-file notes.md --latest=false
          fi
