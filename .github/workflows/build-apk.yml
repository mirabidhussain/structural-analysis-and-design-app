name: Build Android APK

on:
  push:
    branches: [ main ]
    paths: [ 'www/**', 'android/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IS-StructDesign.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IS-StructDesign-apk
          path: IS-StructDesign.apk
      # Always-current download link: Releases → "latest-apk"
      - name: Publish to release "latest-apk"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: IS StructDesign — latest APK
          body: |
            Debug APK built automatically from commit ${{ github.sha }}.
            Install: download IS-StructDesign.apk on your phone, open it, allow "Install unknown apps" for your browser/files app.
          files: IS-StructDesign.apk
          make_latest: true
